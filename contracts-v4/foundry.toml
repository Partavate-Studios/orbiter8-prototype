# Orbiter 8, Demo 4 contracts (docs/demo4-plan.md). Libraries: ./setup.sh
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.38"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
  "bls-solidity/=lib/bls-solidity/src/",
]

[fuzz]
runs = 512
