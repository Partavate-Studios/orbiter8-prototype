<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="Ubuntu, sans-serif">
  <!-- Round 2, items 2 and 3 on the whole screen: the system strip on the card (bottom left) and the
       new zoom beside the minimap (top right). -->
  <rect width="1440" height="900" fill="#130e24"/>
  <circle cx="720" cy="355" r="9" fill="#fff1c4"/>
  <g fill="none" stroke="#4a3f75"><circle cx="720" cy="355" r="120"/><circle cx="720" cy="355" r="210"/><circle cx="720" cy="355" r="320"/></g>
  <circle cx="840" cy="355" r="7" fill="#e5823e"/><circle cx="572" cy="505" r="9" fill="#2f7fd9"/>
  <circle cx="572" cy="505" r="26" fill="none" stroke="#c3b3da" stroke-dasharray="3 3"/>
  <text x="600" y="880" font-size="12" fill="#c3b3da">Round 2 · items 2 and 3 on one screen (1440×900).</text>

  <!-- pilot plate -->
  <rect x="16" y="16" width="318" height="66" rx="12" fill="#0d0719" stroke="#7c39cd" stroke-width="4"/>
  <text x="80" y="46" font-size="16" fill="#fff">Ada</text><text x="318" y="46" text-anchor="end" font-size="17" fill="#fff">498,633¢</text>
  <!-- every hold drawn: 40 holds as cells -->
  <g transform="translate(180 58)">
    <rect width="140" height="12" rx="2" fill="#00000055"/>
    <g fill="#74cf84"><rect x="1" y="1" width="2.6" height="4.5"/><rect x="4.5" y="1" width="2.6" height="4.5"/><rect x="8" y="1" width="2.6" height="4.5"/></g>
    <text x="-6" y="10" text-anchor="end" font-size="11" fill="#c3b3da">Cargo 4/40</text>
  </g>

  <!-- where you are -->
  <text x="1362" y="34" text-anchor="end" font-size="12" fill="#ffffffaa">Star System 0</text>
  <text x="1362" y="58" text-anchor="end" font-size="26" fill="#ffffffdd">Sol</text>
  <circle cx="1398" cy="40" r="20" fill="#2a1a4a" stroke="#fff1c4"/>
  <!-- the zoom: a rail beside the minimap, as tall as it -->
  <g transform="translate(1248 72)">
    <rect x="0" y="0" width="34" height="140" rx="17" fill="#12052acc" stroke="#ffffff33"/>
    <text x="17" y="22" text-anchor="middle" font-size="20" fill="#fff">+</text>
    <line x1="17" y1="32" x2="17" y2="110" stroke="#c3b3da66" stroke-width="2"/>
    <g fill="#c3b3da"><rect x="11" y="44" width="12" height="1.5"/><rect x="11" y="76" width="12" height="1.5"/><rect x="11" y="100" width="12" height="1.5"/></g>
    <rect x="7" y="68" width="20" height="10" rx="5" fill="#e6dcf5" stroke="#000"/>
    <text x="17" y="130" text-anchor="middle" font-size="22" fill="#fff">−</text>
    <g font-size="10" fill="#c3b3da" text-anchor="end"><text x="-6" y="48">ship</text><text x="-6" y="80">planet</text><text x="-6" y="104">system</text></g>
  </g>
  <rect x="1290" y="72" width="134" height="140" rx="8" fill="#12052acc" stroke="#ffffff33"/>
  <g transform="translate(1357 142)" fill="none" stroke="#c3b3da44"><circle r="16"/><circle r="30"/><circle r="48"/></g>
  <rect x="1336" y="124" width="26" height="20" fill="#ffffff14" stroke="#fff"/>
  <text x="1357" y="228" text-anchor="middle" font-size="10" fill="#c3b3da">drag the box to look · wheel to zoom</text>
  <g transform="translate(1270 240)">
    <circle cx="20" cy="20" r="20" fill="#2a1a4a" stroke="#6fa8ff"/><circle cx="74" cy="20" r="20" fill="#2a1a4a" stroke="#e6dcf5"/><circle cx="128" cy="20" r="20" fill="#2a1a4a" stroke="#fff1c4"/>
    <g font-size="11" fill="#c3b3da" text-anchor="middle"><text x="20" y="56">Planets</text><text x="74" y="56">Ships</text><text x="128" y="56">Jump</text></g>
  </g>
  <text x="1180" y="330" font-size="12" fill="#c3b3da">The rail's top end opens the galaxy map;</text>
  <text x="1180" y="346" font-size="12" fill="#c3b3da">drag its thumb or click anywhere on it.</text>

  <!-- the selection, with the strip -->
  <g transform="translate(16 500)">
    <rect x="0" y="0" width="500" height="42" rx="21" fill="#12052ae6" stroke="#3f3566"/>
    <text x="18" y="27" font-size="18" fill="#c3b3da">‹</text>
    <circle cx="50" cy="21" r="10" fill="#fff1c4"/><circle cx="84" cy="21" r="6" fill="#9a8fb2"/><circle cx="112" cy="21" r="8" fill="#e5823e"/>
    <circle cx="144" cy="21" r="14" fill="none" stroke="#b9a0ff" stroke-width="2"/><circle cx="144" cy="21" r="8" fill="#2f7fd9"/>
    <circle cx="176" cy="21" r="7" fill="#a5583c"/><circle cx="208" cy="21" r="11" fill="#e58fb5"/><circle cx="240" cy="21" r="10" fill="#d97aa8"/><circle cx="270" cy="21" r="8" fill="#5fb8e8"/><circle cx="298" cy="21" r="8" fill="#1e8fd8"/><circle cx="324" cy="21" r="5" fill="#9a8fb2"/>
    <text x="482" y="27" text-anchor="end" font-size="18" fill="#c3b3da">›</text>
    <rect x="226" y="66" width="258" height="300" rx="12" fill="#1b1531f2" stroke="#5a4c8c"/>
    <text x="360" y="220" text-anchor="middle" font-size="12" fill="#c3b3da">the slide-out menu</text>
    <rect x="0" y="52" width="236" height="332" rx="12" fill="#1b1531" stroke="#2f7fd9" stroke-width="4"/>
    <rect x="12" y="62" width="212" height="22" rx="11" fill="#2f7fd9"/><text x="118" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b1531">Earth</text>
  </g>
  <text x="530" y="560" font-size="12" fill="#c3b3da">The next planet: one move from the card's buttons.</text>
</svg>
