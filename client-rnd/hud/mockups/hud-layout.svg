<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1930 1010" font-family="Ubuntu, sans-serif" font-size="13">
  <!-- Orbiter 8, HUD redesign: the proposed layout, desktop (1440x900) and portrait phone (390x844).
       A schematic in the game's colors (libs/palette.js): what goes where, not final art.
       The cards, icons and menus are the game's own; only their placement changes. -->
  <defs>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c1aae"/><stop offset=".1" stop-color="#280b4b"/><stop offset=".5" stop-color="#5c1aae"/><stop offset=".9" stop-color="#280b4b"/><stop offset="1" stop-color="#5c1aae"/>
    </linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fff1c4"/><stop offset="1" stop-color="#fff1c4" stop-opacity="0"/></radialGradient>
    <g id="btn"><circle r="22" fill="#2a1a4a" stroke="#8a80a3" stroke-width="1.5"/></g>
    <g id="card">
      <rect x="-2" y="-2" width="144" height="214" rx="25" ry="5" fill="#5a4c8c"/>
      <rect width="140" height="210" rx="25" ry="5" fill="#1b1531"/>
      <path d="M-1 29V3Q-1 -1 23 -1H33M141 29V3Q141 -1 117 -1H107M-1 181V207Q-1 211 23 211H33M141 181V207Q141 211 117 211H107" fill="none" stroke="#7d8bc4" stroke-width="4" stroke-linecap="round"/>
      <rect x="5" y="5" width="130" height="15" rx="25" ry="5" fill="#7d8bc4"/>
      <text x="70" y="16" text-anchor="middle" font-size="8" font-weight="bold" fill="#1b1531">I.S.S.</text>
      <circle cx="70" cy="62" r="22" fill="#fff"/><path d="M58 50L82 74M82 50L58 74" stroke="#1b1531" stroke-width="5"/>
      <rect x="5" y="105" width="130" height="100" rx="25" ry="5" fill="#1b1531" stroke="#000" stroke-width=".5"/>
      <g fill="#ffffffaa" font-size="5.5"><text x="15" y="118" fill="#fff">Space Station</text><text x="50" y="132" text-anchor="end">Metals:</text><text x="56" y="132">300 ↑ Buying</text><text x="50" y="142" text-anchor="end">Organics:</text><text x="56" y="142">300 ↓ Selling</text><text x="50" y="152" text-anchor="end">Equipment:</text><text x="56" y="152">300 ↓ Selling</text></g>
    </g>
  </defs>

  <rect width="1930" height="1010" fill="#0b0916"/>
  <text x="20" y="30" fill="#e6dcf5" font-size="18">Desktop, 1440 × 900: four corners by purpose, the middle left to the game</text>
  <text x="1500" y="30" fill="#e6dcf5" font-size="18">Phone, 390 × 844</text>

  <!-- ===================== DESKTOP ===================== -->
  <g transform="translate(20 50)">
    <rect width="1440" height="900" fill="#130e24" stroke="#3f3566"/>
    <!-- the world -->
    <circle cx="1330" cy="40" r="260" fill="url(#sun)" opacity=".5"/>
    <circle cx="720" cy="375" r="250" fill="none" stroke="#4a3f75" stroke-dasharray="6 6"/>
    <circle cx="640" cy="470" r="46" fill="#2f7fd9"/>
    <circle cx="720" cy="375" r="14" fill="#fff"/>
    <!-- selection ring and its leader to the card -->
    <circle cx="720" cy="375" r="60" fill="none" stroke="#a9b4e0" stroke-dasharray="3 3" stroke-width="1.5"/>
    <path d="M678 418L560 560H470" fill="none" stroke="#a9b4e0" stroke-dasharray="3 3" stroke-width="1.5" opacity=".7"/>
    <!-- the old cards' footprint, for comparison -->
    <g fill="none" stroke="#ff6fb0" stroke-dasharray="2 6" opacity=".55">
      <rect x="358" y="206" width="238" height="350" rx="8"/><rect x="845" y="206" width="238" height="350" rx="8"/>
      <text x="477" y="196" text-anchor="middle" fill="#ff6fb0" stroke="none" font-size="11">today: the card, beside the selection</text>
      <text x="964" y="196" text-anchor="middle" fill="#ff6fb0" stroke="none" font-size="11">today: its menu</text>
    </g>

    <!-- 1 top left: the pilot -->
    <g transform="translate(16 16)">
      <rect width="330" height="64" rx="10" fill="url(#pill)" stroke="#ffffff22"/>
      <rect x="4" y="4" width="322" height="56" rx="8" fill="#000000aa"/>
      <use href="#btn" x="34" y="32"/><circle cx="34" cy="32" r="22" fill="none" stroke="#ebff99" stroke-width="1.5"/>
      <circle cx="34" cy="25" r="5" fill="#fff"/><rect x="26" y="31" width="16" height="13" rx="4" fill="#fff"/>
      <text x="66" y="27" fill="#fff" font-size="15">Ada</text><text x="66" y="46" fill="#bdb5d4" font-size="12">Lantern</text>
      <text x="316" y="27" fill="#fff" font-size="15" text-anchor="end">1,000¢</text>
      <g transform="translate(206 37)"><rect width="18" height="10" rx="2" fill="#74cf84"/><rect x="22" width="18" height="10" rx="2" fill="#74cf84"/><rect x="44" width="18" height="10" rx="2" fill="#e08a4f"/><rect x="66" width="18" height="10" rx="2" fill="none" stroke="#bdb5d4"/><rect x="88" width="18" height="10" rx="2" fill="none" stroke="#bdb5d4"/></g>
      <text x="200" y="46" fill="#bdb5d4" font-size="11" text-anchor="end">Cargo 3/5</text>
      <rect x="0" y="72" width="150" height="24" rx="12" fill="#12052ae6" stroke="#ebff9966"/><text x="75" y="88" text-anchor="middle" fill="#ebff99" font-size="12">Session · 3h 52m left</text>
      <text x="0" y="122" fill="#b9a0ff" font-size="12">① You: who, ship, credits, cargo, session.</text>
      <text x="0" y="138" fill="#b9a0ff" font-size="12">Click: your ship (Space). Cargo opens the full list.</text>
    </g>

    <!-- notifications -->
    <g transform="translate(560 12)">
      <rect width="320" height="44" rx="12" fill="#12052ae6" stroke="#c3b3da44"/><circle cx="20" cy="22" r="5" fill="none" stroke="#ff6fb0" stroke-width="2"/>
      <text x="36" y="19" fill="#e6dcf5">Buying 3 Organics</text><text x="36" y="35" fill="#c3b3da" font-size="12">Confirm it in your wallet</text>
      <rect x="60" y="52" width="200" height="24" rx="12" fill="#12052ae6" stroke="#ebff9966"/><text x="160" y="68" text-anchor="middle" fill="#ebff99" font-size="12">Scanning this star… 23 s</text>
      <text x="160" y="98" text-anchor="middle" fill="#b9a0ff" font-size="12">② What's happening: moves, scans, the network</text>
    </g>

    <!-- 3 top right: where you are -->
    <g transform="translate(1424 16)">
      <text x="-62" y="16" text-anchor="end" fill="#bdb5d4" font-size="12">Star System 0</text>
      <text x="-62" y="44" text-anchor="end" fill="#fff" font-size="26">Sol</text>
      <use href="#btn" x="-26" y="28"/><circle cx="-26" cy="28" r="8" fill="#fff1c4"/>
      <rect x="-130" y="62" width="130" height="130" rx="8" fill="#12052acc" stroke="#ffffff33"/>
      <circle cx="-65" cy="127" r="50" fill="none" stroke="#c3b3da33"/><circle cx="-65" cy="127" r="30" fill="none" stroke="#c3b3da33"/><circle cx="-65" cy="127" r="3" fill="#fff1c4"/><circle cx="-50" cy="110" r="3" fill="#ccff00"/><rect x="-62" y="100" width="24" height="16" fill="#ffffff14" stroke="#fff" stroke-width=".8"/>
      <g transform="translate(-130 218)"><use href="#btn" x="22"/><use href="#btn" x="76"/><use href="#btn" x="130" opacity="0"/>
        <circle cx="22" r="9" fill="#6fa8ff"/><text x="22" y="38" text-anchor="middle" fill="#bdb5d4" font-size="11">Planets</text><circle cx="40" cy="-14" r="9" fill="#230b41" stroke="#ffffff88"/><text x="40" y="-10" text-anchor="middle" fill="#fff" font-size="10">9</text>
        <path d="M68 4l8-10 8 10z" fill="#fff"/><text x="76" y="38" text-anchor="middle" fill="#bdb5d4" font-size="11">Ships</text>
        <use href="#btn" x="130" y="0"/><path d="M120 0h20M130 -10v20" stroke="#fff" stroke-width="2"/><text x="130" y="38" text-anchor="middle" fill="#bdb5d4" font-size="11">Jump</text>
      </g>
      <g transform="translate(-65 286)"><line x1="-50" x2="50" stroke="#c3b3da66" stroke-dasharray="4 2"/><circle cx="-56" r="10" fill="#c3b3da"/><text x="-56" y="5" text-anchor="middle" fill="#000" font-size="16">−</text><circle cx="56" r="10" fill="#c3b3da"/><text x="56" y="5" text-anchor="middle" fill="#000" font-size="16">+</text><rect x="18" y="-6" width="4" height="12" rx="2" fill="#c3b3da"/></g>
      <text x="-140" y="80" text-anchor="end" fill="#b9a0ff" font-size="12">③ Where you are, what's here, how to leave:</text>
      <text x="-140" y="96" text-anchor="end" fill="#b9a0ff" font-size="12">star, minimap, planets, ships, jump, zoom.</text>
    </g>

    <!-- 4 bottom left: the selection: the card in your hand, its buttons beside it -->
    <g transform="translate(16 884)">
      <g transform="translate(0 -318) scale(1.5)"><use href="#card"/></g>
      <g transform="translate(232 -318)">
        <rect width="250" height="318" rx="10" fill="#1b1531ee" stroke="#5a4c8c"/>
        <g font-weight="bold" fill="#fff" text-anchor="middle" font-size="15">
          <rect x="10" y="10" width="230" height="40" rx="40" ry="12" fill="url(#pill)" stroke="#5b1aaa"/><text x="125" y="36">Trade at Port</text>
          <rect x="10" y="58" width="230" height="40" rx="40" ry="12" fill="url(#pill)" stroke="#5b1aaa"/><text x="125" y="84">Dock at Shipyards</text>
          <rect x="10" y="106" width="230" height="40" rx="40" ry="12" fill="url(#pill)" stroke="#5b1aaa"/><text x="125" y="132">Visit the Armory</text>
          <rect x="10" y="154" width="230" height="40" rx="40" ry="12" fill="url(#pill)" stroke="#5b1aaa"/><text x="125" y="180">Visit Planet</text>
        </g>
        <g transform="translate(125 286)"><use href="#btn" x="-30" transform="scale(.8)"/><use href="#btn" x="30" transform="scale(.8)"/><text x="-24" y="5" text-anchor="middle" fill="#fff" font-size="16">×</text><circle cx="24" r="7" fill="#2f7fd9"/></g>
      </g>
      <text x="500" y="-44" fill="#b9a0ff" font-size="12">④ What you selected: its card, held at the corner,</text>
      <text x="500" y="-28" fill="#b9a0ff" font-size="12">and what you can do, as big buttons beside it.</text>
      <text x="500" y="-12" fill="#b9a0ff" font-size="12">A line ties the card to the thing. 1–9 press the buttons.</text>
    </g>

    <!-- 5 bottom right: people and help -->
    <g transform="translate(1424 852)">
      <rect x="-306" y="-34" width="306" height="82" rx="14" fill="#12052acc" stroke="#3f3566"/>
      <g fill="#bdb5d4" font-size="11" text-anchor="middle">
        <use href="#btn" x="-270"/><text x="-270" y="38">Help</text><text x="-270" y="6" fill="#fff" font-size="20">?</text>
        <circle cx="-252" cy="-16" r="9" fill="#230b41" stroke="#ffffff88"/><text x="-252" y="-12" fill="#fff" font-size="10">5</text>
        <use href="#btn" x="-212"/><text x="-212" y="38">Sieges</text><path d="M-220 -8L-204 8M-204 -8L-220 8" stroke="#fff" stroke-width="2"/>
        <use href="#btn" x="-154"/><text x="-154" y="38">Ranks</text><path d="M-162 -8h16v6a8 8 0 0 1-16 0zM-158 8h8" stroke="#fff" fill="#fff"/>
        <use href="#btn" x="-96"/><text x="-96" y="38">Chat</text><circle cx="-96" r="3" fill="#fff"/><path d="M-106 -8a14 14 0 0 0 0 16M-86 -8a14 14 0 0 1 0 16" stroke="#fff" fill="none" stroke-width="2"/>
        <use href="#btn" x="-38"/><text x="-38" y="38">Settings</text><circle cx="-38" r="8" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="4 2.3"/>
      </g>
      <text x="0" y="-48" text-anchor="end" fill="#b9a0ff" font-size="12">⑤ Everyone else, and the game itself: one labeled dock.</text>
    </g>

    <!-- a menu, slid up: only as tall as what's in it; the corners stay -->
    <g transform="translate(720 884)" opacity=".5">
      <rect x="-270" y="-250" width="540" height="250" rx="10" fill="#1b1531" stroke="#7d8bc4" stroke-dasharray="6 4"/>
      <text y="-200" text-anchor="middle" fill="#e6dcf5" font-size="15">A menu slides up here (Trade, Shipyard, Colony…)</text>
      <text y="-176" text-anchor="middle" fill="#bdb5d4">as tall as its content, never the whole screen;</text>
      <text y="-158" text-anchor="middle" fill="#bdb5d4">the pilot, the system and the dock stay in view and in reach.</text>
      <text y="-140" text-anchor="middle" fill="#bdb5d4">The card stays too; its buttons give way to the menu.</text>
    </g>
  </g>

  <!-- ===================== PHONE ===================== -->
  <g transform="translate(1500 50)">
    <rect width="390" height="844" fill="#130e24" stroke="#3f3566"/>
    <circle cx="390" cy="60" r="150" fill="url(#sun)" opacity=".35"/>
    <circle cx="195" cy="352" r="150" fill="none" stroke="#4a3f75" stroke-dasharray="6 6"/>
    <circle cx="120" cy="430" r="34" fill="#2f7fd9"/>
    <circle cx="195" cy="352" r="12" fill="#fff"/><circle cx="195" cy="352" r="46" fill="none" stroke="#a9b4e0" stroke-dasharray="3 3" stroke-width="1.5"/>

    <!-- the pilot strip -->
    <g transform="translate(8 8)">
      <rect width="374" height="52" rx="10" fill="url(#pill)" stroke="#ffffff22"/><rect x="3" y="3" width="368" height="46" rx="8" fill="#000000aa"/>
      <text x="14" y="23" fill="#fff" font-size="15">Ada</text><text x="14" y="40" fill="#bdb5d4" font-size="11">Lantern</text>
      <text x="362" y="23" fill="#fff" font-size="15" text-anchor="end">1,000¢</text>
      <g transform="translate(252 31)"><rect width="18" height="9" rx="2" fill="#74cf84"/><rect x="22" width="18" height="9" rx="2" fill="#74cf84"/><rect x="44" width="18" height="9" rx="2" fill="#e08a4f"/><rect x="66" width="18" height="9" rx="2" fill="none" stroke="#bdb5d4"/><rect x="88" width="18" height="9" rx="2" fill="none" stroke="#bdb5d4"/></g>
      <text x="246" y="40" fill="#bdb5d4" font-size="11" text-anchor="end">Cargo 3/5</text>
    </g>
    <!-- system: name and minimap -->
    <text x="296" y="84" text-anchor="end" fill="#bdb5d4" font-size="11">Star System 0</text><text x="296" y="108" text-anchor="end" fill="#fff" font-size="22">Sol</text>
    <rect x="304" y="68" width="78" height="78" rx="8" fill="#12052acc" stroke="#ffffff33"/><circle cx="343" cy="107" r="28" fill="none" stroke="#c3b3da33"/><circle cx="343" cy="107" r="3" fill="#fff1c4"/><circle cx="352" cy="96" r="2.5" fill="#ccff00"/>
    <rect x="8" y="68" width="150" height="24" rx="12" fill="#12052ae6" stroke="#ebff9966"/><text x="83" y="84" text-anchor="middle" fill="#ebff99" font-size="12">Scanning this star… 23 s</text>
    <!-- zoom, right edge -->
    <g transform="translate(360 520)"><circle r="20" fill="#2a1a4a" stroke="#8a80a3"/><text y="7" text-anchor="middle" fill="#fff" font-size="22">+</text><circle cy="48" r="20" fill="#2a1a4a" stroke="#8a80a3"/><text y="55" text-anchor="middle" fill="#fff" font-size="22">−</text></g>

    <!-- the selection: a sheet above the tab bar: the card small (tap to hold it up), its buttons big -->
    <g transform="translate(0 596)">
      <rect x="6" width="378" height="178" rx="14" fill="#1b1531f2" stroke="#5a4c8c"/>
      <g transform="translate(16 12) scale(.72)"><use href="#card"/></g>
      <g font-weight="bold" fill="#fff" text-anchor="middle" font-size="15">
        <rect x="128" y="12" width="246" height="44" rx="40" ry="12" fill="url(#pill)" stroke="#5b1aaa"/><text x="251" y="40">Trade at Port</text>
        <rect x="128" y="64" width="246" height="44" rx="40" ry="12" fill="url(#pill)" stroke="#5b1aaa"/><text x="251" y="92">Dock at Shipyards</text>
        <rect x="128" y="116" width="246" height="44" rx="40" ry="12" fill="url(#pill)" stroke="#5b1aaa"/><text x="251" y="144">Visit the Armory</text>
      </g>
      <text x="251" y="174" text-anchor="middle" fill="#9088aa" font-size="10">scrolls for more</text>
    </g>
    <!-- tab bar: the thumb's row -->
    <g transform="translate(0 780)">
      <rect width="390" height="64" fill="#12052af2" stroke="#3f3566"/>
      <g fill="#bdb5d4" font-size="11" text-anchor="middle">
        <use href="#btn" x="39" y="24" transform="translate(0 0)"/><text x="39" y="58">My ship</text><circle cx="39" cy="24" r="22" fill="none" stroke="#ebff99" stroke-width="1.5"/>
        <use href="#btn" x="117" y="24"/><text x="117" y="58">Star</text><circle cx="117" cy="24" r="8" fill="#fff1c4"/>
        <use href="#btn" x="195" y="24"/><text x="195" y="58">Planets</text><circle cx="195" cy="24" r="9" fill="#6fa8ff"/>
        <use href="#btn" x="273" y="24"/><text x="273" y="58">Chat</text><circle cx="273" cy="24" r="3" fill="#fff"/>
        <use href="#btn" x="351" y="24"/><text x="351" y="58">More</text><circle cx="341" cy="24" r="2.5" fill="#fff"/><circle cx="351" cy="24" r="2.5" fill="#fff"/><circle cx="361" cy="24" r="2.5" fill="#fff"/>
        <circle cx="369" cy="8" r="9" fill="#230b41" stroke="#ffffff88"/><text x="369" y="12" fill="#fff" font-size="10">5</text>
      </g>
    </g>
    <g fill="#b9a0ff" font-size="12">
      <text x="8" y="180">The selection sits at 42% of the height,</text><text x="8" y="196">clear of the strip above and the sheet below.</text>
      <text x="8" y="560">Tap the small card to hold it up full size.</text>
      <text x="0" y="870">More: Ships, Jump, Sieges, Ranks, Help, Settings (badges carry over).</text>
      <text x="0" y="888">Menus rise from the bottom, as tall as their content, over the tab bar.</text>
    </g>
  </g>
  <text x="20" y="985" fill="#9088aa" font-size="12">Pink dashes: where today's card and its menu sit (beside the selection, 13% of a desktop screen in its middle; on a phone the card covers the selection and 46% of the screen).</text>
</svg>
