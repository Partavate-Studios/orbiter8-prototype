<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="system-ui, sans-serif" fill="#dbe7ee">
  <title>Desktop · Galaxy: rail, hex chart with reach and a plotted course, the survey panel</title>
  <rect width="1440" height="900" fill="#060d14"/>
  <text x="16" y="28" font-size="10" fill="#8aa2b1" letter-spacing="1.2">VEGA</text><text x="58" y="29" font-size="15" font-weight="600">Sol</text>
  <text x="1320" y="29" font-size="14" font-family="monospace" text-anchor="end">497,563</text><text x="1380" y="29" font-size="14" font-family="monospace" text-anchor="end">1/250</text>
  <line y1="44" y2="44" x2="1440" stroke="#1f3442"/><line x1="76" x2="76" y1="44" y2="900" stroke="#1f3442"/><line x1="1036" x2="1036" y1="44" y2="900" stroke="#1f3442"/>
