  <text x="1051" y="128" font-size="10" fill="#8aa2b1" letter-spacing="1.2">DISCOVERED BY</text><text x="1051" y="148" font-size="14">nobody yet</text><text x="1180" y="128" font-size="10" fill="#8aa2b1" letter-spacing="1.2">SCAN</text><text x="1180" y="148" font-size="14">starts on arrival</text>
