  <g font-size="12" fill="#8aa2b1"><circle cx="1063" cy="218" r="11" fill="#d9a066"/><text x="1081" y="222">Gaseous</text><circle cx="1153" cy="218" r="6" fill="#ff7a3c"/><text x="1165" y="222">Lava</text><circle cx="1212" cy="218" r="5" fill="#6f8f4e"/><text x="1223" y="222">Swamp</text><circle cx="1288" cy="218" r="6" fill="#ff7a3c"/><text x="1300" y="222">Lava</text><circle cx="1350" cy="218" r="8" fill="#bfe6f2"/><text x="1364" y="222">Ice</text></g>
  <line x1="1051" x2="1426" y1="243" y2="243" stroke="#1f3442"/><text x="1051" y="266" font-size="10" fill="#8aa2b1" letter-spacing="1.2">COURSE</text><text x="1426" y="266" font-size="11" fill="#8aa2b1" text-anchor="end">1 jump</text>
  <path d="M1060 283h366v39l-9 9h-366v-39z" fill="#ffb454"/><text x="1238" y="304" font-size="14" font-weight="600" fill="#1c1203" text-anchor="middle">Jump to Star 18</text><text x="1238" y="320" font-size="10" font-family="monospace" fill="#1c1203" opacity=".8" text-anchor="middle">you would be its discoverer</text>
</svg>
