  <defs><path id="h" d="M0-38l33 19v38L0 38l-33-19v-38z"/></defs>
  <g fill="#6fd3ff" fill-opacity=".045" stroke="#6fd3ff" stroke-opacity=".16"><use href="#h" x="556" y="472"/><use href="#h" x="622" y="472"/><use href="#h" x="490" y="472"/><use href="#h" x="589" y="415"/><use href="#h" x="523" y="415"/><use href="#h" x="589" y="529"/><use href="#h" x="523" y="529"/><use href="#h" x="688" y="472"/><use href="#h" x="424" y="472"/><use href="#h" x="655" y="415"/><use href="#h" x="457" y="415"/><use href="#h" x="655" y="529"/><use href="#h" x="457" y="529"/><use href="#h" x="556" y="358"/><use href="#h" x="622" y="358"/><use href="#h" x="490" y="358"/><use href="#h" x="556" y="586"/><use href="#h" x="622" y="586"/><use href="#h" x="490" y="586"/></g>
  <circle cx="556" cy="472" r="16" fill="#ffe08a" opacity=".2"/><circle cx="556" cy="472" r="5" fill="#ffe08a"/><path d="M556 458l-5-9 5 3 5-3z" fill="#ffb454"/><text x="556" y="494" font-size="10" fill="#8aa2b1" text-anchor="middle">Sol</text>
  <circle cx="526" cy="524" r="4" fill="#ff8a6b"/><rect x="524" y="533" width="4" height="4" fill="#ffb454"/><text x="526" y="552" font-size="10" fill="#8aa2b1" text-anchor="middle">Lalande 21185</text>
  <g fill="none" stroke-width="1.3"><circle cx="486" cy="476" r="5" stroke="#ff8a6b"/><circle cx="628" cy="468" r="6" stroke="#ffe08a"/><circle cx="594" cy="410" r="5" stroke="#ff8a6b"/><circle cx="452" cy="532" r="5" stroke="#ffb872"/><circle cx="560" cy="590" r="5" stroke="#ff8a6b"/></g>
  <circle cx="590" cy="528" r="5" fill="#000" stroke="#b79cff" stroke-width="1.5"/><path d="M596 526L1036 440" stroke="#b79cff" stroke-opacity=".4" stroke-dasharray="2 6"/>
  <path d="M556 472L452 532" stroke="#ffb454" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g stroke="#6fd3ff" stroke-width="1.5" fill="none"><path d="M441 524a14 14 0 0 1 5-5M458 519a14 14 0 0 1 6 5M463 540a14 14 0 0 1-5 5M446 545a14 14 0 0 1-6-5"/></g><text x="452" y="562" font-size="10" text-anchor="middle">Star 18</text>
  <text x="556" y="860" font-size="11" fill="#56707f" text-anchor="middle">filled = visited · open ring = never visited · shaded hexes = your reach · dashed amber = the course</text>
  <!-- panel -->
  <circle cx="1066" cy="85" r="14" fill="none" stroke="#ffb872" stroke-width="2"/><text x="1093" y="80" font-size="18" font-weight="600">Star 18</text><text x="1093" y="102" font-size="13" fill="#8aa2b1">Class K star · 2 cells away</text>
