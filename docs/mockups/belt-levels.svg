<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif">
<!-- Mockup: the asteroid belt at three zoom levels (far, mid, close). Reference picture only; the rock art is in orbiter-client/src/assets/art/ (asteroid-*.svg, belt-rocks.svg) -->
<defs>
  <g id="rk-a"><path d="M-1 -.3L-.4 -1L.6 -.8L1 0L.5 .9L-.5 1Z"/><path d="M1 0L.5 .9L-.5 1L.1 .1Z" fill="#000000" opacity="0.28"/></g>
  <g id="rk-b"><path d="M-.9 .2L-.6 -.8L.3 -1L1 -.3L.8 .7L-.2 1Z"/><path d="M1 -.3L.8 .7L-.2 1L.2 0Z" fill="#000000" opacity="0.28"/></g>
  <g id="rk-c"><path d="M-1 0L-.3 -.9L.7 -.6L1 .4L.1 1L-.8 .7Z"/><path d="M.7 -.6L1 .4L.1 1L.1 .1Z" fill="#000000" opacity="0.28"/></g>
  <path id="hex" d="M0 -9L7.8 -4.5V4.5L0 9L-7.8 4.5V-4.5Z" fill="#c3b3da" fill-opacity="0.08" stroke="#c3b3da" stroke-width="1" stroke-dasharray="3 2"/>
  <path id="station-mark" d="M0 -3L3 0L0 3L-3 0Z" fill="#e5cfff" stroke="#130e24" stroke-width="0.6"/>
</defs>
<rect width="760" height="300" fill="#130e24"/>
<g fill="#1a1433" stroke="#3a2f5c"><rect x="10" y="10" width="240" height="250" rx="8"/><rect x="260" y="10" width="240" height="250" rx="8"/><rect x="510" y="10" width="240" height="250" rx="8"/></g>
<g fill="#c3b3da" font-size="13" text-anchor="middle"><text x="130" y="281">far</text><text x="380" y="281">mid</text><text x="630" y="281">close</text></g>
<g font-size="9" fill="#c3b3da"><rect x="20" y="20" width="8" height="8" fill="#7a6862"/><text x="32" y="27">carbonaceous</text><rect x="100" y="20" width="8" height="8" fill="#b39c80"/><text x="112" y="27">silicate</text><rect x="154" y="20" width="8" height="8" fill="#8b93a0"/><text x="166" y="27">metallic</text></g>

<!-- far: a thick translucent band around the star, tinted by section -->
<g transform="translate(130 142)">
  <circle r="26" fill="#e5cfff" opacity="0.08"/><circle r="9" fill="#fff1cf"/>
  <circle r="36" fill="none" stroke="#c3b3da" stroke-width="0.6" opacity="0.4"/><circle cx="31" cy="-18" r="3.5" fill="#8f7fb0"/>
  <g fill="none" stroke-width="18" opacity="0.5">
    <path d="M70 0A70 70 0 0 1 35 60.6" stroke="#b39c80"/><path d="M35 60.6A70 70 0 0 1 -35 60.6" stroke="#7a6862"/><path d="M-35 60.6A70 70 0 0 1 -70 0" stroke="#8b93a0"/><path d="M-70 0A70 70 0 0 1 -35 -60.6" stroke="#b39c80"/><path d="M-35 -60.6A70 70 0 0 1 35 -60.6" stroke="#7a6862"/><path d="M35 -60.6A70 70 0 0 1 70 0" stroke="#8b93a0"/>
  </g>
  <circle r="92" fill="none" stroke="#c3b3da" stroke-width="0.6" opacity="0.4"/><circle cx="-80" cy="46" r="4.5" fill="#8f7fb0"/>
</g>

<!-- mid: the band, one dot per section's asteroid, a marker for its station; one section empty -->
<g>
  <circle cx="380" cy="215" r="24" fill="#e5cfff" opacity="0.08"/><circle cx="380" cy="215" r="9" fill="#fff1cf"/>
  <g fill="none" stroke-width="28" opacity="0.4">
    <path d="M285 215A95 95 0 0 1 312.800 147.800" stroke="#7a6862"/><path d="M312.800 147.800A95 95 0 0 1 380 120" stroke="#b39c80"/><path d="M380 120A95 95 0 0 1 447.200 147.800" stroke="#8b93a0"/><path d="M447.200 147.800A95 95 0 0 1 475 215" stroke="#b39c80"/>
  </g>
  <g stroke="#130e24" stroke-width="1.5"><path d="M302.900 137.900L322.700 157.700"/><path d="M380 106V134"/><path d="M457.100 137.900L437.300 157.700"/></g>
  <circle cx="292.200" cy="178.600" r="5.500" fill="#4c3f39" stroke="#7d6c64"/><use href="#station-mark" x="299.500" y="171.500"/>
  <circle cx="343.600" cy="127.200" r="5.500" fill="#a5917c" stroke="#dccdb5"/><use href="#station-mark" x="351" y="120"/>
  <circle cx="416.400" cy="127.200" r="5.500" fill="none" stroke="#c3b3da" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="467.800" cy="178.600" r="5.500" fill="#a5917c" stroke="#dccdb5"/>
  <g font-size="8" fill="#c3b3da" opacity="0.8" text-anchor="middle"><text x="416" y="100">empty</text><text x="351" y="100">station</text></g>
</g>

<!-- close: rocks in two layers, an asteroid with its station, and six mining slots in the empty section -->
<path d="M512 96Q630 66 748 96V206Q630 176 512 206Z" fill="#b39c80" opacity="0.1"/>
<path d="M636 70Q640 130 636 196" fill="none" stroke="#c3b3da" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.5"/>
<g fill="#6f6a78" opacity="0.4">
  <use href="#rk-a" transform="translate(528 92) scale(2)"/><use href="#rk-b" transform="translate(548 178) rotate(40) scale(2.5)"/><use href="#rk-c" transform="translate(600 84) rotate(-20) scale(1.8)"/><use href="#rk-a" transform="translate(616 186) rotate(60) scale(2.2)"/><use href="#rk-b" transform="translate(624 112) scale(1.5)"/><use href="#rk-c" transform="translate(652 92) rotate(30) scale(2.4)"/><use href="#rk-a" transform="translate(662 170) rotate(-50) scale(1.8)"/><use href="#rk-b" transform="translate(724 96) rotate(15) scale(2)"/><use href="#rk-c" transform="translate(736 150) scale(2.6)"/><use href="#rk-a" transform="translate(712 188) rotate(80) scale(1.6)"/><use href="#rk-b" transform="translate(524 150) rotate(-30) scale(1.6)"/><use href="#rk-c" transform="translate(690 78) rotate(55) scale(1.5)"/><use href="#rk-a" transform="translate(580 196) rotate(10) scale(1.7)"/><use href="#rk-b" transform="translate(740 120) rotate(70) scale(1.4)"/>
</g>
<g transform="translate(574 138) scale(0.62)">
  <path d="M-34 -34Q-16 -50 6 -44Q30 -48 40 -28Q52 -10 44 10Q46 32 26 40Q8 52 -14 44Q-38 46 -44 24Q-54 4 -46 -14Q-46 -28 -34 -34Z" fill="#a5917c" stroke="#dccdb5" stroke-width="1.6"/>
  <path d="M40 -28Q52 -10 44 10Q46 32 26 40Q8 52 -14 44Q10 36 24 14Q36 -6 40 -28Z" fill="#786a60"/>
  <g fill="#857363"><ellipse cx="-4" cy="2" rx="10" ry="8"/><ellipse cx="-26" cy="-14" rx="6" ry="4.800"/><ellipse cx="-16" cy="26" rx="5" ry="4"/></g>
  <g transform="translate(22 -30)">
    <ellipse cx="-11" cy="8" rx="10" ry="3.500" fill="#8f7fb0" stroke="#e5cfff"/>
    <path d="M-1 16L4 -18L9 16M0.500 6H7.500M2 -4H6" fill="none" stroke="#e5cfff" stroke-width="1.2"/>
    <rect x="10" y="5" width="9" height="11" rx="1.500" fill="#b9a6d6" stroke="#e5cfff"/><path d="M19 16V10A3.500 3.500 0 0 1 26 10V16Z" fill="#8f7fb0" stroke="#e5cfff"/>
    <g fill="#e5cfff"><circle cx="-16" cy="-8" r="1.500"/><circle cx="16" cy="-12" r="1.500"/><circle cx="-6" cy="-16" r="1.200"/></g>
  </g>
</g>
<use href="#hex" x="676" y="116"/><use href="#hex" x="696" y="116"/><use href="#hex" x="686" y="134"/><use href="#hex" x="706" y="134"/><use href="#hex" x="676" y="152"/><use href="#hex" x="696" y="152"/>
<g fill="#9c8f84">
  <use href="#rk-b" transform="translate(538 116) rotate(25) scale(4.5)"/><use href="#rk-c" transform="translate(604 172) rotate(-35) scale(5)"/><use href="#rk-a" transform="translate(618 96) rotate(50) scale(3)"/><use href="#rk-c" transform="translate(726 172) rotate(10) scale(4)"/><use href="#rk-a" transform="translate(652 190) rotate(-15) scale(3.4)"/>
</g>
<g fill="#8a8590">
  <use href="#rk-a" transform="translate(532 190) rotate(-60) scale(3.6)"/><use href="#rk-b" transform="translate(654 128) rotate(75) scale(3)"/><use href="#rk-c" transform="translate(722 126) rotate(-45) scale(3.2)"/><use href="#rk-b" transform="translate(668 80) rotate(5) scale(4)"/><use href="#rk-a" transform="translate(566 84) rotate(35) scale(3.2)"/>
</g>
<g font-size="8" fill="#c3b3da" opacity="0.8" text-anchor="middle"><text x="574" y="232">asteroid + station</text><text x="691" y="232">empty: 6 mining slots</text></g>
</svg>
