t-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">Your unit, job board and this console run</text><text x="18" y="224.2" fill="#bdb5d4" font-size="13" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">through it. Switch any time.</text><rect x="322" y="116" width="44" height="16" rx="3" fill="#00000055" stroke="#9088aa" stroke-width="1" stroke-dasharray="3 2"/><text x="344" y="128" fill="#bdb5d4" font-size="10" font-family="'Ubuntu Mono', ui-monospace, monospace" text-anchor="middle">draft</text><rect x="18" y="254" width="354" height="128" rx="16" fill="#221a3d" stroke="#3f3566" stroke-width="1.2"/><rect x="18" y="254" width="354" height="8" rx="4" fill="#4d7cff"/><g transform="translate(54 322) scale(0.85)" fill="none" stroke="#4d7cff" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><rect x="-17" y="-17" width="34" height="34" rx="3"/><path d="M-10 -10 L10 10 M10 -10 L-10 10"/><rect x="-11" y="-11" width="22" height="22" rx="1" stroke-width="1.4"/></g><text x="88" y="290" fill="#f1eefa" font-size="19" font-family="Georgia, 'Times New Roman', serif" font-weight="600">Corp X</text><text x="88" y="312" fill="#9088aa" font-size="12" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">Shareholder corporation · Old Earth</text><text x="88" y="334" fill="#bdb5d4" font-size="13" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-style="italic">“Your rights are protected by</text><text x="88" y="352.2" fill="#bdb5d4" font-size="13" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-style="italic">contract.”</text><rect x="12" y="390" width="366" height="140" rx="20" fill="none" stroke="#b9a0ff" stroke-width="2.5"/><rect x="18" y="396" width="354" height="128" rx="16" fill="#221a3d" stroke="#c3b3da" stroke-width="2"/><rect x="18" y="396" width="354" height="8" rx="4" fill="#2fae7e"/><g transform="translate(54 464) scale(0.85)" fill="none" stroke="#2fae7e" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><circle cx="0" cy="-7" r="9"/><circle cx="-8" cy="6" r="9"/><circle cx="8" cy="6" r="9"/></g><text x="88" y="432" fill="#f1eefa" font-size="19" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="600">Corp Y</text><text x="88" y="454" fill="#9088aa" font-size="12" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">Family conglomerate · Old Earth</text><text x="88" y="476" fill="#bdb5d4" font-size="13" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-style="italic">“You’re taken care of, as long as you</text><text x="88" y="494.2" fill="#bdb5d4" font-size="13" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-style="italic">belong.”</text><rect x="18" y="538" width="354" height="128" rx="16" fill="#221a3d" stroke="#3f3566" stroke-width="1.2"/><rect x="18" y="538" width="354" height="8" rx="4" fill="#22c7e6"/><g transform="translate(54 606) scale(0.85)" fill="none" stroke="#22c7e6" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><circle cx="-4" cy="4" r="9"/><path d="M-19 12 C -4 -2, 8 -10, 18 -16" /><circle cx="18" cy="-16" r="2.6" fill="#ff8a3d" stroke="none"/></g><text x="88" y="574" fill="#f1eefa" font-size="19" font-family="'Ubuntu Mono', ui-monospace, monospace" font-weight="600">Corp Z</text><text x="88" y="596" fill="#9088aa" font-size="12" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">Space-born upstart · The colonies</text><text x="88" y="618" fill="#bdb5d4" font-size="13" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-style="italic">“Get out there. We’ll figure out the</text><text x="88" y="636.2" fill="#bdb5d4" font-size="13" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-style="italic">rest.”</text><rect x="18" y="754" width="354" height="56" rx="28" fill="#c3b3da" stroke="#c3b3da" stroke-width="1.2"/><text x="195" y="788.3" fill="#1c0838" font-size="18" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="500" text-anchor="middle">Subscribe to Corp Y</text><rect x="0" y="0" width="390" height="44" fill="#0b0916" opacity="0.72"/><text x="16" y="28" fill="#bdb5d4" font-size="13" font-family="'Ubuntu Mono', ui-monospace, monospace">23:41 · Curfew</text><rect x="278" y="8" width="100" height="28" rx="14" fill="none" stroke="#ffffff40" stroke-width="1.2"/><text x="328" y="26.2" fill="#f1eefa" font-size="12" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="500" text-anchor="middle">Skip intro</text>
