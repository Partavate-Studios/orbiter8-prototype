ct x="103.5" y="776" width="85.5" height="54" rx="14" fill="none" stroke="#ffffff30" stroke-width="1"/><text x="146.25" y="808" fill="#f1eefa" font-size="14" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="500" text-anchor="middle">Health</text><rect x="201" y="776" width="85.5" height="54" rx="14" fill="none" stroke="#ffffff30" stroke-width="1"/><text x="243.75" y="808" fill="#f1eefa" font-size="14" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="500" text-anchor="middle">Mail</text><circle cx="276.5" cy="780" r="11" fill="#e1177c"/><text x="276.5" y="784.5" fill="#f1eefa" font-size="12" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="700" text-anchor="middle">2</text><rect x="298.5" y="776" width="85.5" height="54" rx="14" fill="#c3b3da" stroke-width="1"/><text x="341.25" y="808" fill="#1c0838" font-size="14" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="500" text-anchor="middle">Jobs</text><rect x="9.900000000000006" y="92" width="128.2" height="17" rx="3" fill="#000000aa" stroke="#9088aa" stroke-width="1" stroke-dasharray="3 2"/><text x="74" y="105" fill="#bdb5d4" font-size="11" font-family="'Ubuntu Mono', ui-monospace, monospace" text-anchor="middle">widget: listening</text><g transform="translate(342 260) rotate(30) scale(0.010869565217391304) translate(-2300 -2300)"><path d="M2303 0c0,0 0,0 0,0 233,0 443,102 598,259 151,152 249,355 249,588 0,332 0,663 0,995l0 100c170,37 340,84 510,138 12,-109 63,-204 137,-279 87,-88 204,-146 335,-146 0,0 0,0 0,0 130,0 247,58 334,146 85,85 140,198 140,328 0,117 0,234 0,351 0,117 0,234 0,351 -67,27 -135,50 -202,68l12 72c4,27 8,53 12,79 9,51 17,101 25,150 -53,27 -106,50 -161,62 -53,13 -107,17 -160,17 -54,0 -108,-4 -161,-17 -54,-12 -107,-35 -161,-62 8,-49 17,-99 25,-151 4,-25 8,-51 13,-78 3,-24 7,-48 11,-72 -67,-18 -134,-41 -201,-68 0,-117 0,-234 0,-351l0 -96c-170,-54 -339,-100 -508,-137l0 589c-135,56 -269,102 -404,136l13 81c6,42 13,84 20,125 13,82 27,163 40,243 -86,42 -171,79 -258,99 -85,20 -172,27 -258,27 -86,0 -173,-7 -258,-27 -87,-20 -173,-57 -258,-99 13,-80 26,-161 40,-243 7,-41 13,-83 20,-125 4,-27 8,-54 13,-81 -135,-34 -269,-81 -404,-136l0 -589c-169,37 -338,83 -508,137l0 96c0,117 0,234 0,351 -67,27 -134,50 -201,68l11 72c4,27 8,53 13,79 8,51 16,101 25,150 -54,27 -107,50 -161,62 -53,13 -107,17 -161,17 -54,0 -108,-4 -161,-17 -54,-12 -107,-35 -161,-62 9,-49 17,-99 26,-151 4,-25 8,-51 12,-78 4,-24 8,-48 11,-72 -67,-18 -134,-41 -201,-68 0,-117 0,-234 0,-351 0,-117 0,-234 0,-351 0,-130 55,-243 139,-328 87,-88 205,-146 335,-146 0,0 0,0 0,0 130,0 248,58 335,146 74,75 125,170 137,279 170,-54 340,-101 510,-138l0 -100c0,-332 0,-663 0,-995 0,-233 97,-436 249,-589 155,-156 365,-258 598,-258z" fill="none" stroke="#ccff00" stroke-width="130"/></g><text x="18" y="250" fill="#f1eefa" font-size="19" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="500">Pilot, Orbiter 8 program</text><circle cx="24" cy="272" r="5" fill="#ccff00"/><text x="36" y="277" fill="#ebff99" font-size="13" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">You’re eligible · Corp Y Shipping</text><text x="18" y="308" fill="#9088aa" font-size="12" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="600">Your body</text><text x="18" y="326" fill="#f1eefa" font-size="14" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">is frozen and kept in cold storage, to be bought</text><text x="18" y="345.6" fill="#f1eefa" font-size="14" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">back one day.</text><text x="18" y="373.2" fill="#9088aa" font-size="12" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="600">Your mind</text><text x="18" y="391.2" fill="#f1eefa" font-size="14" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">is uploaded to Minerva. You fly a ship; she</text><text x="18" y="410.8" fill="#f1eefa" font-size="14" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">flies with you.</text><text x="18" y="438.4" fill="#9088aa" font-size="12" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="600">Your name</text><text x="18" y="456.4" fill="#f1eefa" font-size="14" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">out there is a call sign: the one on file.</text><text x="18" y="484" fill="#9088aa" font-size="12" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="600">The work</text><text x="18" y="502" fill="#f1eefa" font-size="14" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">Space shipping: trade, explore, claim the worlds</text><text x="18" y="521.6" fill="#f1eefa" font-size="14" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">you find.</text><text x="18" y="549.2" fill="#9088aa" font-size="12" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="600">The terms</text><text x="18" y="567.2" fill="#f1eefa" font-size="14" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">Keep most of what you earn. The program advances</text><text x="18" y="586.8000000000001" fill="#f1eefa" font-size="14" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">a hold of goods.</text><text x="18" y="614.4000000000001" fill="#9088aa" font-size="12" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="600">And</text><text x="18" y="632.4000000000001" fill="#f1eefa" font-size="14" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">citizenship of Corp Y, from the day you’re</text><text x="18" y="652.0000000000001" fill="#f1eefa" font-size="14" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif">processed.</text><rect x="322" y="290" width="44" height="16" rx="3" fill="#00000066" stroke="#9088aa" stroke-width="1" stroke-dasharray="3 2"/><text x="344" y="302" fill="#bdb5d4" font-size="10" font-family="'Ubuntu Mono', ui-monospace, monospace" text-anchor="middle">draft</text><rect x="13" y="679" width="364" height="68" rx="34" fill="none" stroke="#b9a0ff" stroke-width="2.5"/><rect x="18" y="684" width="354" height="58" rx="29" fill="#c3b3da" stroke="#c3b3da" stroke-width="1.2"/><text x="195" y="719.65" fill="#1c0838" font-size="19" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="500" text-anchor="middle">Accept the job</text><rect x="0" y="0" width="390" height="44" fill="#030306" opacity="0.8"/><text x="16" y="28" fill="#bdb5d4" font-size="13" font-family="'Ubuntu Mono', ui-monospace, monospace">23:41 · Curfew</text><rect x="278" y="8" width="100" height="28" rx="14" fill="none" stroke="#ffffff40" stroke-width="1.2"/><text x="328" y="26.2" fill="#f1eefa" font-size="12" font-family="Ubuntu, 'Segoe UI', system-ui, sans-serif" font-weight="500" text-anchor="middle">Skip intro</text>
</svg>
