<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120">
<!-- Deep Scanner (idea): a planet sweeping far (Orbiter 8 art, 120 units square, centered; drawn for docs/tech-trees and free to use in the game) -->
<defs>
  <radialGradient id="planetGradient" cx="10%" cy="50%" r="180%" fx="0%" fy="50%"><stop offset="0%" stop-color="#e5cfff"/><stop offset="10%" stop-color="#e5cfff"/><stop offset="20%" stop-color="#c3b3da"/><stop offset="30%" stop-color="rgb(140,120,180)"/><stop offset="40%" stop-color="rgb(60,40,90)"/><stop offset="100%" stop-color="rgb(60,40,90)"/></radialGradient>
  <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#c3b3da" stop-opacity="0.1"/><stop offset="50%" stop-color="#e5cfff" stop-opacity="0.9"/><stop offset="100%" stop-color="#c3b3da" stop-opacity="0.1"/></linearGradient>
  <clipPath id="just-the-planet"><circle r="10"/></clipPath>
